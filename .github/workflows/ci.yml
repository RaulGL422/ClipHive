name: Build and Test

on:
  push:
    branches:
      - main
      - development
      - 'feature/**'
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The ffmpeg-backed tests (render filter graph, audio chunking, clipping)
      # skip themselves without it; DESIGN.md 16.3 wants them run in CI.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: ./mvnw -B compile test

      # Convenience only: a full artifact storage quota mustn't fail the build.
      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore
