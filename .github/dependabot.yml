# Weekly dependency updates, as PRs against development (main is only updated
# by merging development). Minor and patch bumps come grouped in one PR per
# ecosystem; majors (a Spring Boot or Java bump) come alone, to be read first.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: development
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: ["minor", "patch"]

  # The Temurin base images in the Dockerfile (pinned to exact tags)
  - package-ecosystem: docker
    directory: "/"
    target-branch: development
    schedule:
      interval: weekly
