# Weekly dependency updates, as PRs against development (main is only updated
# by merging development). Minor and patch bumps come grouped in one PR per
# ecosystem; majors (a Spring Boot or Java bump) come alone, to be read first.
# A release is only offered once it has been out for a week (cooldown), so a
# hijacked or broken release has time to be noticed and pulled first.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    target-branch: development
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types: ["minor", "patch"]
    # OpenJFX stays on 25, the same line as the JDK (docs/DESIGN.md §20.2):
    # only its minor and patch updates are offered.
    ignore:
      - dependency-name: "org.openjfx:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: development
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: ["minor", "patch"]

  # The Temurin base images in the Dockerfile (pinned to exact tags). Java
  # stays on the 25 LTS: only updates within 25 are offered.
  - package-ecosystem: docker
    directory: "/"
    target-branch: development
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
