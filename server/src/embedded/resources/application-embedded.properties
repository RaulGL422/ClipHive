# Volatile embedded PostgreSQL - no CLIPHIVE_DB_* vars needed.
# Data is discarded when the JVM exits. Local tries only: this profile (and the
# embedded Postgres it needs) is only in builds made with -Pembedded.
#
# From the sources (Windows: .\mvnw.cmd instead of ./mvnw):
#   ./mvnw spring-boot:run -pl server -Pembedded -Dspring-boot.run.profiles=embedded
#
# Or as a JAR:
#   ./mvnw -pl server package -Pembedded -DskipTests
#   java -jar server/target/server-0.1.0-SNAPSHOT.jar --spring.profiles.active=embedded
logging.level.io.github.raulgl422.cliphive=DEBUG
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Throwaway signing key for this profile only.
# Production values come from CLIPHIVE_URL_SIGNING_KEY in .env.
cliphive.url-signing-key=embedded-profile-test-signing-key

# Test admin credentials for the embedded profile (not used in production).
cliphive.admin-user=admin
cliphive.admin-password=admin123
# 32-byte Base64 key for AES-256-GCM (test-only, never used in production).
# AAAA...A= is 43 A's + 1 '=' = 44 chars = 32 zero bytes in Base64.
cliphive.encryption-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
# Shown on the /legal pages (test-only).
cliphive.operator-name=Embedded Operator
cliphive.operator-email=operator@example.com

# Worker connector on loopback, so a worker on this same machine can connect
# to ws://localhost:8082/ws/worker (production binds it to the Tailscale IP).
cliphive.worker-bind=127.0.0.1

# Local HTTP, no TLS in front: a Secure cookie would not be sent back.
server.servlet.session.cookie.secure=false
