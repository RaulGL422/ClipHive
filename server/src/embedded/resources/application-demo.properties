# Made-up sample data for the embedded server (docs/DESIGN.md §13.1), to look
# around a superadmin that isn't empty. Only together with `embedded`:
#   ./mvnw spring-boot:run -pl server -Pembedded -Dspring-boot.run.profiles=embedded,demo
#
# Adds db/demo (a repeatable Flyway migration) to the normal migrations.
spring.flyway.locations=classpath:db/migration,classpath:db/demo

# The data is inert: no schedule may act on it (no platform calls, no email).
cliphive.planner.scheduler-enabled=false
cliphive.publishing.scheduler-enabled=false
cliphive.stats.scheduler-enabled=false
cliphive.alerts.scheduler-enabled=false
cliphive.cleanup.scheduler-enabled=false
