# Base configuration, shared by every profile. See docs/DESIGN.md section
# 13.1 for what each CLIPHIVE_* variable is for, and .env.example to set them.
spring.application.name=cliphive-server

# Admin HTTP connector (docs/DESIGN.md section 3.2).
server.port=${CLIPHIVE_ADMIN_PORT:8080}
# The browser reaches the superadmin over HTTPS (Cloudflare Tunnel) even though
# cloudflared talks plain HTTP to this port, so mark the session cookie Secure.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# Media + worker connectors — wired in TomcatConnectorConfig.
cliphive.media-port=${CLIPHIVE_MEDIA_PORT:8081}
cliphive.media-public-url=${CLIPHIVE_MEDIA_PUBLIC_URL:}
cliphive.worker-bind=${CLIPHIVE_WORKER_BIND:}
cliphive.worker-port=${CLIPHIVE_WORKER_PORT:8082}
cliphive.url-signing-key=${CLIPHIVE_URL_SIGNING_KEY:}

spring.datasource.url=${CLIPHIVE_DB_URL:}
spring.datasource.username=${CLIPHIVE_DB_USER:}
spring.datasource.password=${CLIPHIVE_DB_PASSWORD:}

# Flyway owns the schema; Hibernate only ever validates it - ddl-auto is
# never update/create.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Disable OSIV: views are server-rendered (Thymeleaf) but we don't want
# implicit queries during rendering.
spring.jpa.open-in-view=false

# One thread per @Scheduled job: Spring's default is a single thread, so one
# slow job (render setup calling Claude, the planner) would stop task dispatch,
# heartbeats and publishing until it finished. Keep it above the number of
# @Scheduled methods (10 with the daily yt-dlp update).
spring.task.scheduling.pool.size=12

# Superadmin account — created on first boot from env vars (docs/DESIGN.md §12.1)
cliphive.admin-user=${CLIPHIVE_ADMIN_USER:}
cliphive.admin-password=${CLIPHIVE_ADMIN_PASSWORD:}
# AES-256-GCM key for encrypting OAuth tokens and TOTP secrets in DB (Base64, 32 bytes)
cliphive.encryption-key=${CLIPHIVE_ENCRYPTION_KEY:}

# Publishing (docs/DESIGN.md §11, §13.1)
cliphive.admin-public-url=${CLIPHIVE_ADMIN_PUBLIC_URL:}
# Operator named on the public /legal pages (docs/DESIGN.md §11.5)
cliphive.operator-name=${CLIPHIVE_OPERATOR_NAME:}
cliphive.operator-email=${CLIPHIVE_OPERATOR_EMAIL:}
cliphive.google-client-id=${CLIPHIVE_GOOGLE_CLIENT_ID:}
cliphive.google-client-secret=${CLIPHIVE_GOOGLE_CLIENT_SECRET:}
cliphive.meta-app-id=${CLIPHIVE_META_APP_ID:}
cliphive.meta-app-secret=${CLIPHIVE_META_APP_SECRET:}
cliphive.tiktok-client-key=${CLIPHIVE_TIKTOK_CLIENT_KEY:}
cliphive.tiktok-client-secret=${CLIPHIVE_TIKTOK_CLIENT_SECRET:}

# Email alerts over SMTP (docs/DESIGN.md §12.3) — empty host = alerts off.
# Not spring.mail.*: EmailSender builds its own sender from these.
cliphive.smtp.host=${CLIPHIVE_SMTP_HOST:}
cliphive.smtp.port=${CLIPHIVE_SMTP_PORT:587}
cliphive.smtp.user=${CLIPHIVE_SMTP_USER:}
cliphive.smtp.password=${CLIPHIVE_SMTP_PASSWORD:}
cliphive.smtp.from=${CLIPHIVE_SMTP_FROM:}

# External tool paths — optional; autodetected from PATH if not set.
# See docs/DESIGN.md section 13.1 and .env.example for the full env var list.
cliphive.data-dir=${CLIPHIVE_DATA_DIR:}
cliphive.ytdlp-path=${CLIPHIVE_YTDLP_PATH:}
cliphive.ffmpeg-path=${CLIPHIVE_FFMPEG_PATH:}
cliphive.ffprobe-path=${CLIPHIVE_FFPROBE_PATH:}
cliphive.claude-path=${CLIPHIVE_CLAUDE_PATH:}
