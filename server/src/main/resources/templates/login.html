<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:insert="~{admin/_fragments/head :: head('Login')}"></head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>🐝 ClipHive</h1>
    <p class="subtitle">Superadmin</p>

    <div th:if="${param.error}" class="alert alert-error">
      Credenciales incorrectas. Inténtalo de nuevo.
    </div>
    <div th:if="${param.blocked}" class="alert alert-error">
      Demasiados intentos fallidos. Espera 15 minutos.
    </div>
    <div th:if="${param.logout}" class="alert alert-info">
      Sesión cerrada correctamente.
    </div>

    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autofocus autocomplete="username" required/>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required/>
      </div>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
  </div>
</div>
</body>
</html>
