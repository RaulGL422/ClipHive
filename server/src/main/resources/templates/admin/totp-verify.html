<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:insert="~{admin/_fragments/head :: head('2FA')}"></head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>🔐 2FA</h1>
    <p class="subtitle">Introduce el código de tu aplicación TOTP</p>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="@{/admin/totp}" method="post">
      <div class="form-group">
        <label for="code">Código de 6 dígitos</label>
        <input type="text" id="code" name="code" maxlength="6" inputmode="numeric"
               pattern="[0-9]{6}" autofocus autocomplete="one-time-code" required/>
      </div>
      <button type="submit" class="btn btn-primary">Verificar</button>
    </form>
  </div>
</div>
</body>
</html>
