<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:insert="~{admin/_fragments/head :: head('Dashboard')}"></head>
<body>
<div class="layout">
  <div th:insert="~{admin/_fragments/sidebar :: sidebar('dashboard')}"></div>
  <div class="main">
    <div class="topbar"><h1>Dashboard</h1></div>
    <div class="content">

      <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

      <!-- Stats — refreshed every 8s (the form below is left alone so typing isn't lost) -->
      <div class="stat-grid" id="dash-stats"
           hx-get="/admin" hx-trigger="every 8s" hx-swap="outerHTML" hx-select="#dash-stats">
        <div class="card">
          <div class="card-title">Trabajos</div>
          <div class="card-value" th:text="${totalJobs}">0</div>
        </div>
        <div class="card">
          <div class="card-title">Clips</div>
          <div class="card-value" th:text="${totalClips}">0</div>
        </div>
        <div class="card">
          <div class="card-title">Workers activos</div>
          <div class="card-value" th:text="${connectedWorkers}">0</div>
        </div>
      </div>

      <!-- Submit form -->
      <div class="card" style="margin-bottom:24px">
        <div class="card-title" style="margin-bottom:12px">Nuevo trabajo</div>
        <form th:action="@{/admin/jobs}" method="post" style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
          <div class="form-group" style="flex:1;min-width:260px;margin-bottom:0">
            <label for="url">URL del vídeo</label>
            <input type="text" id="url" name="url" placeholder="https://youtube.com/watch?v=..." required/>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label for="language">Idioma</label>
            <select id="language" name="language" style="width:90px">
              <option value="">Auto</option>
              <option value="es">ES</option>
              <option value="en">EN</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label for="fpsMode">FPS</label>
            <select id="fpsMode" name="fpsMode" style="width:90px">
              <option value="auto">Auto</option>
              <option value="30">30</option>
              <option value="60">60</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label for="audioLanguage">Audio</label>
            <select id="audioLanguage" name="audioLanguage" style="width:150px"
                    title="Si el vídeo tiene una pista doblada en ese idioma se usa; si no, el audio original.">
              <option value="">Original</option>
              <option value="es">Doblaje español</option>
              <option value="en">Doblaje inglés</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label for="clipMode">Clips</label>
            <select id="clipMode" name="clipMode" style="width:130px"
                    title="Automático: Claude elige los clips. Manual: los marcas tú viendo el vídeo.">
              <option value="AUTO">Automático</option>
              <option value="MANUAL">Manual</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
      </div>

      <!-- Recent jobs -->
      <div class="section-header">
        <h2>Trabajos recientes</h2>
        <a th:href="@{/admin/jobs}" class="btn btn-secondary btn-sm">Ver todos</a>
      </div>
      <div class="table-wrap card" style="padding:0" id="dash-jobs"
           hx-get="/admin" hx-trigger="every 8s" hx-swap="outerHTML" hx-select="#dash-jobs">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>URL</th><th>Estado</th><th>Creado</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${recentJobs.empty}">
              <td colspan="4" style="text-align:center;color:var(--text-muted);padding:20px">
                No hay trabajos todavía.
              </td>
            </tr>
            <tr th:each="job : ${recentJobs}">
              <td><a th:href="@{/admin/jobs/{id}(id=${job.id})}" th:text="${#strings.abbreviate(job.id.toString(),12)}" style="color:var(--accent)"></a></td>
              <td th:text="${#strings.abbreviate(job.sourceUrl,50)}"></td>
              <td>
                <span class="badge" th:classappend="'badge-' + ${job.state.name().toLowerCase()}"
                      th:text="${job.state}"></span>
              </td>
              <td th:text="${#temporals.format(job.createdAt,'dd/MM HH:mm','UTC')}"></td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Recent logs -->
      <div class="section-header" style="margin-top:24px">
        <h2>Logs recientes</h2>
        <a th:href="@{/admin/logs}" class="btn btn-secondary btn-sm">Ver todos</a>
      </div>
      <div class="log-stream" id="dash-logs"
           hx-get="/admin" hx-trigger="every 8s" hx-swap="outerHTML" hx-select="#dash-logs">
        <div th:each="e : ${recentLogs}" class="log-entry">
          <span class="log-time" th:text="${#strings.substring(e.createdAt.toString(),11,19)}"></span>
          <span class="log-level" th:classappend="${e.level}" th:text="${e.level}"></span>
          <span class="log-component" th:text="${#strings.abbreviate(e.component,20)}"></span>
          <span class="log-msg" th:text="${e.message}"></span>
        </div>
        <div th:if="${recentLogs.empty}" style="color:var(--text-muted);padding:4px 0">Sin logs.</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
